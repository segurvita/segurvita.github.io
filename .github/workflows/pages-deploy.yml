name: Deploy to GitHub Pages

on:
  push:
    branches:
      - deploy-artifacts
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deploy-artifacts branch
        uses: actions/checkout@v4
        with:
          ref: deploy-artifacts
          fetch-depth: 1

      - name: Verify out directory exists
        run: test -d out || exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

